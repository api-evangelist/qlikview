description: >-
  First-party client-library inventory for QlikView. QlikView is a customer-installed
  Windows product from Qlik and its SDKs are shipped INSIDE the product installer and
  documented on help.qlik.com rather than published to npm, PyPI, NuGet, Maven Central,
  RubyGems, Packagist, crates.io or pkg.go.dev. Searches of every one of those registries
  on 2026-08-29 returned no Qlik-published QlikView package. The QlikView packages that do
  exist on NuGet and npm (QvxLib, QvxLib.Connector, QvWebTicket, Bondski.QvdLib, qvdjs,
  qlik-auth, gulp-qar) are third-party community work and are recorded below with
  official false. Because the first-party SDKs carry no registry metadata endpoint, their
  version tracks the QlikView product release rather than a package version.
registry_findings:
