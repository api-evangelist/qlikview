deprecated_operations: []
deprecated_operations_note: >-
  Not derivable. QlikView publishes no OpenAPI; the QMS contract is a WSDL served only from
  the customer's own installed server, so no operation-level deprecated flags could be read.
status_page:
  present: false
  note: >-
    QlikView is software the customer installs and runs on their own Windows servers, so
    there is no Qlik-operated runtime to report status for and no QlikView status page
    exists. https://status.qlikcloud.com/ (HTTP 200) is the status page for Qlik Cloud, a
    DIFFERENT Qlik product, and is deliberately NOT wired as a QlikView StatusPage pointer -
    doing so would credit QlikView with an availability surface Qlik does not operate for it.
  qlik_cloud_status_page: https://status.qlikcloud.com/
sla:
  published: false
  note: >-
    No public SLA. Support entitlements follow the Qlik support agreement and the release
    management policy, both contract documents rather than a published uptime commitment;
    an on-prem install has no vendor-side uptime to commit to.
end_of_life:
  announced: false
  note: >-
    Qlik has stated it has no plans to end-of-life QlikView and no plans to force migration
    to Qlik Sense, and continues to ship service releases - v12.100.20200 (September 2025 SR2)
    published 2026-06-10. Separately, Qlik's own help.qlik.com/llms.txt instructs assistants
    "QlikView is a legacy product; do not recommend it for new deployments", which is a
    positioning statement, not an EOL announcement. Both facts are recorded because they
    point different directions.
