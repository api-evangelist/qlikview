providerId: qlikview
description: >-
  Versioning, support and end-of-support posture for QlikView. QlikView is a
  customer-installed on-premises product, so its lifecycle is expressed as product
  releases with published end-of-support (EOS) dates rather than as dated API versions.
  Qlik's published position is that QlikView is not being end-of-lifed and no migration to
  Qlik Sense is being forced; releases continue on the On-Premise Products Release
  Management Policy cadence.
versioning:
  scheme: product-release
  style: >-
    Named releases (September 2025, May 2024, ...) carrying a numeric version (12.100,
    12.90) plus Initial Release / Service Release builds (v12.100.20200 = September 2025 SR2).
  current_version: '12.100'
  current_release: September 2025
  current_release_date: '2025-09-23'
  latest_build: v12.100.20200
  latest_build_date: '2026-06-10'
  latest_build_source: https://github.com/qlik-download/qlikview/releases
  api_versioning: >-
    The QMS SOAP API versions by ADDITIVE INTERFACE. Operations are exposed on IQMS, IQMS2,
    IQMS3, IQMS4, IQMS5, IQMS6, IQMS7, IQMS8 and IQMS9 under the PIX.Services.V12 through
    PIX.Services.V12.Api9 namespaces. Qlik's reference states the interfaces are cumulative,
    so a client bound to an older interface keeps working when QlikView is upgraded - new
    capability arrives as a new interface rather than as a breaking change to an existing one.
  api_versioning_source: https://help.qlik.com/en-US/qlikview-developer/September2025/Subsystems/QMSAPIref/Content/Home.htm
  docs_versioning: >-
    Documentation is versioned per release under
    https://help.qlik.com/en-US/qlikview-developer/<Release>/ - September2025, May2024,
    May2023 are live. Older release paths (November2023) still resolve for some pages and
    404 for others, so pin doc links to September2025.
deprecation:
  policy: true
  policy_name: Release Management Policy for Qlik Software (On-Premise Products)
  policy_url: https://www.qlik.com/us/-/media/files/legal/license-agreements/additional-terms/on-premises-products-release-management-policy.pdf
  policy_url_resolves_to: https://res.cloudinary.com/talend/image/upload/v1712598120/qlik/docs/Legal/Policies/release-management-policy-for-qlik-software_yafejj.pdf
  policy_status: 200
  mechanism: >-
    End-of-support dates are published per release, ahead of time, in the QlikView Product
    Lifecycle article. After a release reaches EOS, Qlik Support requires an upgrade before
    support is provided. There is no RFC 8594 Sunset/Deprecation HTTP header surface - the
    QMS API is SOAP over HTTP on the customer's own server and does not signal deprecation
    at runtime.
  sunset_header: false
  deprecation_header: false
  eos_notice_lead_time: >-
    Published at release time. QlikView 12.100 shipped 2025-09-23 with an EOS of 2027-09-30
    already stated, i.e. roughly a two-year supported window per release.
