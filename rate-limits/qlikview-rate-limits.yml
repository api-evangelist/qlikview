specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: QlikView
providerId: qlikview
generated: '2026-08-29'
method: searched
source: https://help.qlik.com/en-US/qlikview-developer/September2025/Subsystems/QMSAPIref/Content/Home.htm
created: '2026-05-04'
modified: '2026-08-29'
limit_count: 0
description: >-
  QlikView publishes NO API rate limits, and none exist to publish. QlikView Server, the
  Management Service (QMS) and the Distribution Service all run on hardware the customer
  owns; Qlik does not meter, throttle or bill API calls against them. The practical ceiling
  is the customer's own CPU, RAM and QlikView CAL licensing, not a vendor quota.
limits: []
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header is documented on any QlikView
    surface. An agent gets no runtime throttling signal at all.
responseCodes:
  throttled: null
  quotaExceeded: null
  note: >-
    No 429 semantics documented. The QMS API is SOAP and reports failure as a SOAP fault.
real_constraints:
  - name: Concurrent user licensing (CALs)
    type: licensing
    description: >-
      QlikView access is governed by Client Access Licenses (Named User, Document, Session,
      Usage CALs) rather than by request rate. Exhausting CALs denies a session; it does not
      throttle an API call.
    source: https://help.qlik.com/en-US/qlikview/September2025/Content/QV_HelpSites/Home.htm
  - name: Server capacity
    type: infrastructure
    description: >-
      QMS API and reload throughput are bounded by the customer's own server resources and
      by the Distribution Service task-concurrency settings they configure.
  - name: QlikView Management API group membership
    type: authorization
    description: >-
      Access is gated by Windows local-group membership, not by a quota. See
      authentication/qlikview-authentication.yml.
provenance_note: >-
  REPLACED 2026-08-29. This file previously carried five invented tiers (free 10 req/min and
  1,000 req/month, professional 100 req/min and 100,000 req/month, enterprise 1,000 req/min)
  plus a full X-RateLimit-* header set, all written by the 2026-05-04 bulk sweep, whose own
  description said "Defaults are scaffold values to be replaced with published provider
  limits". Qlik publishes none of it. An honest zero is the measurement.
