description: >-
  Qlik's public trust and security page, the vendor trust center covering QlikView. Upgraded
  2026-08-29 from the 2026-07-11 pass, which pointed only at https://security.qlik.com/ and
  carried a six-item certification list. security.qlik.com is the Qlik Security Trust Center
  where "Qlik security artifacts are available to customers" - it returned HTTP 403 to an
  anonymous browser-UA request on 2026-08-29, i.e. it is customer-gated. The public,
  anonymously readable trust page is https://www.qlik.com/us/trust (HTTP 200) and it names a
  much longer certification list, recorded below.
scope_note: >-
  These are Qlik company and Qlik Cloud certifications. QlikView is customer-installed
  software running on the customer's own Windows servers, so certifications that certify a
  HOSTED environment (FedRAMP, GovRAMP, TX-RAMP, DISA IL2/IL4, CJIS) attach to Qlik Cloud
  Government, not to a QlikView deployment. The boundary is stated rather than blurred.
