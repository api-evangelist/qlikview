    environment (FedRAMP, GovRAMP, TX-RAMP, DISA IL2/IL4, CJIS) apply to Qlik Cloud
    Government and NOT to a QlikView deployment on a customer's own servers. Recorded with
    that boundary stated rather than silently attributed to QlikView.
