aid: qlikview
name: QlikView
description: >-
  QlikView is Qlik's guided-analytics platform for business intelligence and data
  visualization, installed and run on the customer's own Windows servers rather than
  consumed as a hosted service. Its patented associative in-memory engine lets users
  explore relationships across data sets, and its developer surface is a set of on-premises
  APIs and SDKs: the SOAP-based QlikView Management Service (QMS) API for administration,
  task and document distribution, the Ticket API for custom single sign-on, the AJAX/Qva
  JavaScript API and Workbench ASP.NET controls for embedding, and COM/OCX plus the QVX SDK
  for automation and custom data connectors. Still shipping - 12.100 (September 2025) is
  supported to 2027-09-30.
