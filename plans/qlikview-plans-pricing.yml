specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: QlikView
providerId: qlikview
generated: '2026-08-29'
method: searched
source: https://www.qlik.com/us/pricing
created: '2026-05-04'
modified: '2026-08-29'
plan_count: 0
description: >-
  QlikView publishes NO plans and NO prices. It is a licensed, customer-installed Windows
  product sold through Qlik sales and partners on a quote basis; there is no self-serve
  tier, no API request quota and no published price for any QlikView edition or for any of
  its APIs, which are bundled with the server licence rather than sold separately.
plans: []
provenance_note: >-
  REPLACED 2026-08-29. This file previously carried three invented tiers (qlikview-free at
  1,000 requests/month, qlikview-pro at 100,000, qlikview-enterprise) written by the
  2026-05-04 bulk sweep, whose own description admitted "Tier limits and prices are scaffold
  defaults". None of it was ever published by Qlik. The honest measurement is zero plans,
  and that is what is recorded now.
what_was_checked:
  - url: https://www.qlik.com/us/pricing
    status: 200
    finding: >-
      Prices this page carries - Starter $300/month, Standard $825/month, Premium
      $2,750/month, Enterprise custom quote, all billed annually - are for QLIK CLOUD
      ANALYTICS, a different Qlik product. QlikView is not priced on this page. Deliberately
      NOT recorded as QlikView plans; attributing them would be the exact contamination this
      pipeline exists to avoid.
  - url: https://www.qlik.com/us/products/qlikview
    status: 200
    finding: Product page. No pricing; routes to contact sales / request a demo.
  - url: https://www.qlik.com/us/legal/legal-agreements
    status: 200
    finding: Licence agreements and additional terms. Commercial terms, not published prices.
pricing_model:
  type: quote-only
  self_serve: false
  free_tier: false
  trial: unknown
  trial_note: >-
    QlikView Personal Edition, the historical free desktop tier, was not found on any live
    Qlik page during this pass, so no trial is asserted either way.
  billing: Perpetual or subscription licence negotiated with Qlik sales; not published.
